# Valeurs par défaut du chart Kura.
# Les images applicatives sont poussées dans le registre OCI du client (Zot).

global:
  imageRegistry: "registry.client.interne"
  imageTag: "1.0.0"
  imagePullPolicy: IfNotPresent
  # Nom du Secret existant portant les mots de passe (postgres, valkey, jwt…).
  # Créé par l'équipe d'exploitation du client, jamais versionné.
  existingSecret: "kura-secrets"

# ── Microservices Go + frontend ───────────────────────────────────────────────
# Chaque entrée produit un Deployment + un Service (template générique).
services:
  auth-service:
    port: 8080
    replicas: 2
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {memory: 256Mi}
    # Chaque appel de la plateforme passe par la validation de token : c'est le
    # service dont la charge suit le plus directement le nombre d'utilisateurs.
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 80
  code-service:
    port: 8088
    replicas: 1
    resources:
      requests: {cpu: 25m, memory: 32Mi}
      limits: {memory: 128Mi}
  k8s-service:
    port: 8081
    replicas: 2
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {memory: 256Mi}
    # Interroge les API des clusters clients : la charge depend du nombre de
    # clusters raccordes et des tableaux de bord ouverts simultanement.
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 5
      targetCPUUtilizationPercentage: 70
  terraform-service:
    port: 8082
    replicas: 1
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {memory: 512Mi}
  ansible-service:
    port: 8083
    replicas: 1
    resources:
      requests: {cpu: 25m, memory: 32Mi}
      limits: {memory: 128Mi}
  pipeline-service:
    port: 8084
    replicas: 1
    resources:
      requests: {cpu: 25m, memory: 32Mi}
      limits: {memory: 128Mi}
  metrics-service:
    port: 8086
    replicas: 1
    resources:
      requests: {cpu: 25m, memory: 32Mi}
      limits: {memory: 128Mi}
  vault-service:
    port: 8087
    replicas: 1
    resources:
      requests: {cpu: 25m, memory: 32Mi}
      limits: {memory: 128Mi}
  frontend:
    port: 80
    replicas: 2
    healthPath: /
    # Service statique peu couteux, mais premier point de contact : on preserve
    # le temps de reponse percu en absorbant les pics de connexion.
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 4
      targetCPUUtilizationPercentage: 75
    resources:
      requests: {cpu: 25m, memory: 32Mi}
      limits: {memory: 128Mi}

# Variables d'environnement communes aux microservices Go.
commonEnv:
  ENV: production
  LOG_LEVEL: info
  AUTH_SERVICE_URL: http://auth-service:8080
  K8S_SERVICE_URL: http://k8s-service:8081
  CODE_SERVICE_URL: http://code-service:8088
  VALKEY_HOST: valkey
  VALKEY_PORT: "6379"
  OTEL_EXPORTER_OTLP_ENDPOINT: tempo:4317

# ── Gateway ───────────────────────────────────────────────────────────────────
kong:
  enabled: true
  image: kong:3.4
  replicas: 2
  proxyPort: 8000
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 512Mi}

# ── Briques de données ────────────────────────────────────────────────────────
# port = port d'écoute exposé ; dataPath = point de montage du volume persistant.
postgres:
  enabled: true
  image: postgres:15-alpine
  port: 5432
  dataPath: /var/lib/postgresql/data
  storage: 10Gi
  storageClassName: ""
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 512Mi}

valkey:
  enabled: true
  image: valkey/valkey:8-alpine
  port: 6379
  dataPath: /data
  storage: 1Gi
  storageClassName: ""
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}

minio:
  enabled: true
  image: minio/minio:RELEASE.2024-01-16T16-07-38Z
  port: 9000
  dataPath: /data
  storage: 20Gi
  storageClassName: ""
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}

openbao:
  enabled: true
  image: openbao/openbao:2.5
  port: 8200
  dataPath: /openbao/data
  storage: 2Gi
  storageClassName: ""
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 256Mi}

semaphore:
  enabled: true
  image: semaphoreui/semaphore:v2.10.22
  port: 3000
  dataPath: /var/lib/semaphore
  storage: 2Gi
  storageClassName: ""
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 256Mi}

# ── Observabilité ─────────────────────────────────────────────────────────────
observability:
  enabled: true
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.102.1
    port: 8428
    retention: 15d
    storage: 10Gi
  vmagent:
    image: victoriametrics/vmagent:v1.102.1
  vmalert:
    image: victoriametrics/vmalert:v1.102.1
  alertmanager:
    image: prom/alertmanager:v0.27.0
  grafana:
    image: grafana/grafana:10.2.0
    port: 3000
    storage: 2Gi
  loki:
    image: grafana/loki:2.9.4
    port: 3100
    storage: 10Gi
  promtail:
    image: grafana/promtail:2.9.4
  tempo:
    image: grafana/tempo:2.3.1
    port: 3200
    storage: 10Gi

# ── Exposition ────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  className: nginx
  host: kura.client.interne
  tlsSecretName: kura-tls
