{{- /*
Template générique : un Deployment + un Service par entrée de .Values.services.
Les 8 microservices Go et le frontend partagent la même forme ; seules les
valeurs (port, réplicas, ressources) changent.
*/ -}}
{{- $root := . }}
{{- range $name, $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "kura.labels" $root | nindent 4 }}
    {{- include "kura.selectorLabels" $name | nindent 4 }}
spec:
  {{- /* Sous autoscaling, on omet replicas : sinon le Deployment et l'HPA se
         contredisent et ArgoCD verrait une derive a chaque synchronisation. */}}
  {{- if not (and $svc.autoscaling $svc.autoscaling.enabled) }}
  replicas: {{ $svc.replicas | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "kura.selectorLabels" $name | nindent 6 }}
  template:
    metadata:
      {{- /* Le frontend sert des fichiers statiques et n'expose pas de
             métriques : il est le seul à ne pas être annoté. */}}
      {{- if ne $svc.metrics false }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ $svc.port | quote }}
        prometheus.io/path: {{ $svc.metricsPath | default "/metrics" }}
      {{- end }}
      labels:
        {{- include "kura.labels" $root | nindent 8 }}
        {{- include "kura.selectorLabels" $name | nindent 8 }}
    spec:
      # Kubernetes injecte, par compatibilité avec les liens Docker, une
      # variable <SERVICE>_PORT au format tcp://ip:port pour chaque Service du
      # namespace. Elle écrase la variable de configuration homonyme des
      # services (CODE_SERVICE_PORT, METRICS_SERVICE_PORT...), qui attendent un
      # simple numéro de port.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $name }}
          image: {{ include "kura.serviceImage" (dict "root" $root "name" $name) }}
          imagePullPolicy: {{ $root.Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ $svc.port }}
              name: http
          envFrom:
            - secretRef:
                name: {{ $root.Values.global.existingSecret }}
                optional: true
          env:
            {{- range $key, $value := $root.Values.commonEnv }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: {{ $svc.healthPath | default "/health" }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ $svc.healthPath | default "/health" }}
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "kura.labels" $root | nindent 4 }}
    {{- include "kura.selectorLabels" $name | nindent 4 }}
spec:
  selector:
    {{- include "kura.selectorLabels" $name | nindent 4 }}
  ports:
    - port: {{ $svc.port }}
      targetPort: http
      name: http
{{- end }}
