{{- if .Values.kong.enabled }}
{{- /*
Kong en mode DB-less : la configuration déclarative (routes vers les
microservices, plugins JWT / rate-limiting / prometheus) est la même que
celle utilisée en dev local, montée depuis un ConfigMap créé à partir du
fichier versionné infrastructure/docker/kong.yml.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-declarative
  labels:
    {{- include "kura.labels" . | nindent 4 }}
    {{- include "kura.selectorLabels" "kong" | nindent 4 }}
data:
  kong.yml: |
{{ .Files.Get "config/kong.yml" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  labels:
    {{- include "kura.labels" . | nindent 4 }}
    {{- include "kura.selectorLabels" "kong" | nindent 4 }}
spec:
  replicas: {{ .Values.kong.replicas }}
  selector:
    matchLabels:
      {{- include "kura.selectorLabels" "kong" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kura.labels" . | nindent 8 }}
        {{- include "kura.selectorLabels" "kong" | nindent 8 }}
    spec:
      containers:
        - name: kong
          image: {{ .Values.kong.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: /kong/kong.yml
            - name: KONG_PROXY_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_PROXY_ERROR_LOG
              value: /dev/stderr
            # Status API (lecture seule) : sert /metrics du plugin prometheus.
            # L'Admin API n'est pas exposée : elle permet de modifier la config.
            - name: KONG_STATUS_LISTEN
              value: "0.0.0.0:8100"
          ports:
            - containerPort: {{ .Values.kong.proxyPort }}
              name: proxy
            - containerPort: 8100
              name: status
          volumeMounts:
            - name: declarative
              mountPath: /kong
              readOnly: true
          readinessProbe:
            exec:
              command: ["kong", "health"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.kong.resources | nindent 12 }}
      volumes:
        - name: declarative
          configMap:
            name: kong-declarative
---
apiVersion: v1
kind: Service
metadata:
  name: kong
  labels:
    {{- include "kura.labels" . | nindent 4 }}
    {{- include "kura.selectorLabels" "kong" | nindent 4 }}
spec:
  selector:
    {{- include "kura.selectorLabels" "kong" | nindent 4 }}
  ports:
    - port: {{ .Values.kong.proxyPort }}
      targetPort: proxy
      name: proxy
    - port: 8100
      targetPort: status
      name: status
{{- end }}
