{{- if .Values.observability.enabled }}
{{- /*
Stack d'observabilité : mêmes configurations versionnées qu'en dev local
(infrastructure/docker/), montées via ConfigMap. Les composants avec état
(VictoriaMetrics, Grafana, Loki, Tempo) reçoivent un PVC ; les collecteurs
(vmagent, vmalert, alertmanager) sont des Deployments sans état, et Alloy
tourne en DaemonSet pour lire les journaux de pods sur chaque nœud.
*/ -}}
{{- $root := . }}
{{- $obs := .Values.observability }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-config
  labels:
    {{- include "kura.labels" . | nindent 4 }}
data:
  scrape.yml: |
{{ .Files.Get "config/vmagent-scrape.yml" | indent 4 }}
  alert_rules.yml: |
{{ .Files.Get "config/alert_rules.yml" | indent 4 }}
  alertmanager.yml: |
{{ .Files.Get "config/alertmanager.yml" | indent 4 }}
  loki.yml: |
{{ .Files.Get "config/loki.yml" | indent 4 }}
  tempo.yml: |
{{ .Files.Get "config/tempo.yml" | indent 4 }}
  # Grafana Alloy en mode Kubernetes : decouverte des pods du namespace,
  # etiquette "service" alignee sur app.kubernetes.io/name (meme pivot
  # metriques <-> logs qu'en dev local avec la decouverte Docker).
  #
  # Remplace Promtail, deprecie par Grafana depuis fevrier 2025 : sur ce
  # cluster (k0s 1.36), son fournisseur de decouverte Kubernetes demarre
  # ("Starting provider") sans jamais etablir de watch ni logger d'erreur -
  # confirme par un appel manuel a l'API avec le meme jeton de compte de
  # service, qui repond normalement. Le meme mecanisme de decouverte chez
  # vmagent, sur une base de code plus recente, fonctionne sans probleme.
  #
  # Le chemin des journaux (regle __path__ ci-dessous) recompose le format que
  # le kubelet ecrit : /var/log/pods/<namespace>_<pod>_<uid>/<conteneur>/N.log.
  # River n'accepte pas de commentaire entre deux blocs "rule", d'ou sa place
  # ici plutot qu'au plus pres du bloc concerne.
  alloy.river: |
    discovery.kubernetes "pods" {
      role = "pod"
      namespaces {
        own_namespace = true
      }
    }

    discovery.relabel "pods" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        target_label  = "service"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
      rule {
        source_labels = [
          "__meta_kubernetes_namespace",
          "__meta_kubernetes_pod_name",
          "__meta_kubernetes_pod_uid",
          "__meta_kubernetes_pod_container_name",
        ]
        separator     = "_"
        regex         = "(.+)_(.+)_(.+)_(.+)"
        target_label  = "__path__"
        replacement   = "/var/log/pods/${1}_${2}_${3}/${4}/*.log"
      }
    }

    local.file_match "pods" {
      path_targets = discovery.relabel.pods.output
    }

    loki.source.file "pods" {
      targets    = local.file_match.pods.targets
      forward_to = [loki.write.default.receiver]
    }

    loki.write "default" {
      endpoint {
        url = "http://loki:3100/loki/api/v1/push"
      }
    }
{{- range $comp := list "victoriametrics" "grafana" "loki" "tempo" }}
{{- $spec := index $obs $comp }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $comp }}
  labels:
    {{- include "kura.labels" $root | nindent 4 }}
    {{- include "kura.selectorLabels" $comp | nindent 4 }}
spec:
  serviceName: {{ $comp }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "kura.selectorLabels" $comp | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kura.labels" $root | nindent 8 }}
        {{- include "kura.selectorLabels" $comp | nindent 8 }}
    spec:
      enableServiceLinks: false
      containers:
        - name: {{ $comp }}
          image: {{ $spec.image }}
          imagePullPolicy: {{ $root.Values.global.imagePullPolicy }}
          {{- if eq $comp "victoriametrics" }}
          args:
            - --storageDataPath={{ $spec.dataPath }}
            - --retentionPeriod={{ $spec.retention }}
            - --httpListenAddr=:{{ $spec.port }}
          {{- end }}
          {{- if or (eq $comp "loki") (eq $comp "tempo") }}
          args:
            - -config.file=/etc/obs/{{ $comp }}.yml
          {{- end }}
          {{- if eq $comp "grafana" }}
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.global.existingSecret }}
                  key: GF_SECURITY_ADMIN_PASSWORD
            # Le tableau de bord est affiche dans une iframe par Kura, servie
            # sous /grafana : sans ces trois reglages, Grafana refuse
            # l'integration ou genere des URLs d'assets invalides.
            - name: GF_SECURITY_ALLOW_EMBEDDING
              value: "true"
            - name: GF_SERVER_ROOT_URL
              value: "%(protocol)s://%(domain)s/grafana/"
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_NAME
              value: "Main Org."
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
          {{- end }}
          ports:
            - containerPort: {{ $spec.port }}
              name: main
            {{- if eq $comp "tempo" }}
            # Tempo ecoute deja sur 4317, mais ni le conteneur ni le Service ne
            # declaraient ce port : les traces envoyees par les microservices
            # (OTEL_EXPORTER_OTLP_ENDPOINT) expiraient sans jamais l'atteindre.
            - containerPort: 4317
              name: otlp-grpc
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: {{ $spec.dataPath }}
            {{- if or (eq $comp "loki") (eq $comp "tempo") }}
            - name: config
              mountPath: /etc/obs
              readOnly: true
            {{- end }}
            {{- if eq $comp "grafana" }}
            - name: provisioning-datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: provisioning-dashboards
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
            {{- end }}
      {{- if or (eq $comp "loki") (eq $comp "tempo") }}
      volumes:
        - name: config
          configMap:
            name: observability-config
      {{- end }}
      {{- if eq $comp "grafana" }}
      volumes:
        - name: provisioning-datasources
          configMap:
            name: grafana-provisioning
            items:
              - key: datasources.yaml
                path: datasources.yaml
        - name: provisioning-dashboards
          configMap:
            name: grafana-provisioning
            items:
              - key: dashboards.yaml
                path: dashboards.yaml
        - name: dashboards
          configMap:
            name: grafana-dashboards
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ $spec.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $comp }}
  labels:
    {{- include "kura.labels" $root | nindent 4 }}
    {{- include "kura.selectorLabels" $comp | nindent 4 }}
spec:
  selector:
    {{- include "kura.selectorLabels" $comp | nindent 4 }}
  ports:
    - port: {{ $spec.port }}
      targetPort: main
      name: main
    {{- if eq $comp "tempo" }}
    - port: 4317
      targetPort: otlp-grpc
      name: otlp-grpc
    {{- end }}
{{- end }}
---
{{- /*
vmagent découvre ses cibles via l'API Kubernetes : il lui faut le droit de
lister les pods. Role local et non ClusterRole, la découverte étant restreinte
au namespace de la plateforme (voir config/vmagent-scrape.yml).
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vmagent
  labels:
    {{- include "kura.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vmagent
  labels:
    {{- include "kura.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, services, endpoints]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vmagent
  labels:
    {{- include "kura.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vmagent
subjects:
  - kind: ServiceAccount
    name: vmagent
{{- range $comp := list "vmagent" "vmalert" "alertmanager" }}
{{- $spec := index $obs $comp }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $comp }}
  labels:
    {{- include "kura.labels" $root | nindent 4 }}
    {{- include "kura.selectorLabels" $comp | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "kura.selectorLabels" $comp | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kura.labels" $root | nindent 8 }}
        {{- include "kura.selectorLabels" $comp | nindent 8 }}
    spec:
      enableServiceLinks: false
      {{- if eq $comp "vmagent" }}
      serviceAccountName: vmagent
      {{- end }}
      containers:
        - name: {{ $comp }}
          image: {{ $spec.image }}
          imagePullPolicy: {{ $root.Values.global.imagePullPolicy }}
          {{- if eq $comp "vmagent" }}
          args:
            - --promscrape.config=/etc/obs/scrape.yml
            - --remoteWrite.url=http://victoriametrics:{{ $obs.victoriametrics.port }}/api/v1/write
          {{- else if eq $comp "vmalert" }}
          args:
            - --datasource.url=http://victoriametrics:{{ $obs.victoriametrics.port }}
            - --remoteWrite.url=http://victoriametrics:{{ $obs.victoriametrics.port }}
            - --notifier.url=http://alertmanager:9093
            - --rule=/etc/obs/alert_rules.yml
            - --evaluationInterval=15s
          {{- else if eq $comp "alertmanager" }}
          args:
            - --config.file=/etc/obs/alertmanager.yml
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/obs
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: observability-config
{{- end }}
---
# Grafana Alloy : DaemonSet, un collecteur par nœud, lecture de /var/log/pods.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  labels:
    {{- include "kura.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: alloy
  labels:
    {{- include "kura.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alloy
  labels:
    {{- include "kura.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: alloy
subjects:
  - kind: ServiceAccount
    name: alloy
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy
  labels:
    {{- include "kura.labels" . | nindent 4 }}
    {{- include "kura.selectorLabels" "alloy" | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "kura.selectorLabels" "alloy" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kura.labels" . | nindent 8 }}
        {{- include "kura.selectorLabels" "alloy" | nindent 8 }}
    spec:
      serviceAccountName: alloy
      containers:
        - name: alloy
          image: {{ $obs.alloy.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args:
            - run
            - /etc/obs/alloy.river
            - --server.http.listen-addr=0.0.0.0:12345
            - --storage.path=/var/lib/alloy/data
          volumeMounts:
            - name: config
              mountPath: /etc/obs
              readOnly: true
            - name: pods-logs
              mountPath: /var/log/pods
              readOnly: true
            - name: data
              mountPath: /var/lib/alloy/data
      volumes:
        - name: config
          configMap:
            name: observability-config
        - name: pods-logs
          hostPath:
            path: /var/log/pods
        - name: data
          emptyDir: {}
---
{{- /*
Le frontend interroge vmalert pour afficher l'état des alertes. Nginx résout
ses hôtes amont au démarrage : sans ce Service, il refuse de démarrer.
vmagent n'en a pas besoin, personne ne l'appelle.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: vmalert
  labels:
    {{- include "kura.labels" . | nindent 4 }}
    {{- include "kura.selectorLabels" "vmalert" | nindent 4 }}
spec:
  selector:
    {{- include "kura.selectorLabels" "vmalert" | nindent 4 }}
  ports:
    - port: 8880
      targetPort: 8880
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  labels:
    {{- include "kura.labels" . | nindent 4 }}
    {{- include "kura.selectorLabels" "alertmanager" | nindent 4 }}
spec:
  selector:
    {{- include "kura.selectorLabels" "alertmanager" | nindent 4 }}
  ports:
    - port: 9093
      targetPort: 9093
{{- end }}
