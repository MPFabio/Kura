{{- if .Values.observability.enabled }}
{{- /*
Stack d'observabilité : mêmes configurations versionnées qu'en dev local
(infrastructure/docker/), montées via ConfigMap. Les composants avec état
(VictoriaMetrics, Grafana, Loki, Tempo) reçoivent un PVC ; les collecteurs
(vmagent, vmalert, alertmanager) sont des Deployments sans état, et promtail
tourne en DaemonSet pour lire les journaux de pods sur chaque nœud.
*/ -}}
{{- $root := . }}
{{- $obs := .Values.observability }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-config
  labels:
    {{- include "kura.labels" . | nindent 4 }}
data:
  scrape.yml: |
{{ .Files.Get "config/vmagent-scrape.yml" | indent 4 }}
  alert_rules.yml: |
{{ .Files.Get "config/alert_rules.yml" | indent 4 }}
  alertmanager.yml: |
{{ .Files.Get "config/alertmanager.yml" | indent 4 }}
  # Promtail en mode Kubernetes : découverte des pods du namespace, étiquette
  # "service" alignée sur app.kubernetes.io/name (même pivot métriques ↔ logs
  # qu'en dev local avec la découverte Docker).
  promtail.yml: |
    server:
      http_listen_port: 9080
    positions:
      filename: /run/promtail/positions.yaml
    clients:
      - url: http://loki:3100/loki/api/v1/push
    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              own_namespace: true
        relabel_configs:
          - source_labels: ['__meta_kubernetes_pod_label_app_kubernetes_io_name']
            target_label: service
          - source_labels: ['__meta_kubernetes_pod_name']
            target_label: pod
          - source_labels: ['__meta_kubernetes_pod_uid', '__meta_kubernetes_pod_container_name']
            separator: /
            target_label: __path__
            replacement: /var/log/pods/*$1/*.log
{{- range $comp := list "victoriametrics" "grafana" "loki" "tempo" }}
{{- $spec := index $obs $comp }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $comp }}
  labels:
    {{- include "kura.labels" $root | nindent 4 }}
    {{- include "kura.selectorLabels" $comp | nindent 4 }}
spec:
  serviceName: {{ $comp }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "kura.selectorLabels" $comp | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kura.labels" $root | nindent 8 }}
        {{- include "kura.selectorLabels" $comp | nindent 8 }}
    spec:
      containers:
        - name: {{ $comp }}
          image: {{ $spec.image }}
          imagePullPolicy: {{ $root.Values.global.imagePullPolicy }}
          {{- if eq $comp "victoriametrics" }}
          args:
            - --storageDataPath=/data
            - --retentionPeriod={{ $spec.retention }}
            - --httpListenAddr=:{{ $spec.port }}
          {{- end }}
          ports:
            - containerPort: {{ $spec.port }}
              name: main
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ $spec.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $comp }}
  labels:
    {{- include "kura.labels" $root | nindent 4 }}
    {{- include "kura.selectorLabels" $comp | nindent 4 }}
spec:
  selector:
    {{- include "kura.selectorLabels" $comp | nindent 4 }}
  ports:
    - port: {{ $spec.port }}
      targetPort: main
{{- end }}
{{- range $comp := list "vmagent" "vmalert" "alertmanager" }}
{{- $spec := index $obs $comp }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $comp }}
  labels:
    {{- include "kura.labels" $root | nindent 4 }}
    {{- include "kura.selectorLabels" $comp | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "kura.selectorLabels" $comp | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kura.labels" $root | nindent 8 }}
        {{- include "kura.selectorLabels" $comp | nindent 8 }}
    spec:
      containers:
        - name: {{ $comp }}
          image: {{ $spec.image }}
          imagePullPolicy: {{ $root.Values.global.imagePullPolicy }}
          {{- if eq $comp "vmagent" }}
          args:
            - --promscrape.config=/etc/obs/scrape.yml
            - --remoteWrite.url=http://victoriametrics:{{ $obs.victoriametrics.port }}/api/v1/write
          {{- else if eq $comp "vmalert" }}
          args:
            - --datasource.url=http://victoriametrics:{{ $obs.victoriametrics.port }}
            - --remoteWrite.url=http://victoriametrics:{{ $obs.victoriametrics.port }}/api/v1/write
            - --notifier.url=http://alertmanager:9093
            - --rule=/etc/obs/alert_rules.yml
            - --evaluationInterval=15s
          {{- else if eq $comp "alertmanager" }}
          args:
            - --config.file=/etc/obs/alertmanager.yml
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/obs
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: observability-config
{{- end }}
---
# Promtail : DaemonSet, un collecteur par nœud, lecture de /var/log/pods.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  labels:
    {{- include "kura.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: promtail
  labels:
    {{- include "kura.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: promtail
  labels:
    {{- include "kura.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: promtail
subjects:
  - kind: ServiceAccount
    name: promtail
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  labels:
    {{- include "kura.labels" . | nindent 4 }}
    {{- include "kura.selectorLabels" "promtail" | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "kura.selectorLabels" "promtail" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kura.labels" . | nindent 8 }}
        {{- include "kura.selectorLabels" "promtail" | nindent 8 }}
    spec:
      serviceAccountName: promtail
      containers:
        - name: promtail
          image: {{ $obs.promtail.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args:
            - -config.file=/etc/obs/promtail.yml
          volumeMounts:
            - name: config
              mountPath: /etc/obs
              readOnly: true
            - name: pods-logs
              mountPath: /var/log/pods
              readOnly: true
            - name: positions
              mountPath: /run/promtail
      volumes:
        - name: config
          configMap:
            name: observability-config
        - name: pods-logs
          hostPath:
            path: /var/log/pods
        - name: positions
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  labels:
    {{- include "kura.labels" . | nindent 4 }}
    {{- include "kura.selectorLabels" "alertmanager" | nindent 4 }}
spec:
  selector:
    {{- include "kura.selectorLabels" "alertmanager" | nindent 4 }}
  ports:
    - port: 9093
      targetPort: 9093
{{- end }}
