{{- /*
Briques de données à état : Valkey, MinIO, OpenBao, Semaphore.
Chacune est un StatefulSet à réplique unique avec PVC dédié ; la haute
disponibilité des données repose sur les sauvegardes (runbook PRA) et le
rescheduling Kubernetes, conformément au dossier d'architecture.

PostgreSQL fait exception : il est confié à l'opérateur CloudNativePG
(postgres.yaml), seul à même d'assurer la réplication et la restauration à un
point dans le temps que le PRA suppose.
*/ -}}
{{- $root := . }}
{{- range $name, $spec := dict "valkey" .Values.valkey "minio" .Values.minio "openbao" .Values.openbao "semaphore" .Values.semaphore }}
{{- if $spec.enabled }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "kura.labels" $root | nindent 4 }}
    {{- include "kura.selectorLabels" $name | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "kura.selectorLabels" $name | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kura.labels" $root | nindent 8 }}
        {{- include "kura.selectorLabels" $name | nindent 8 }}
    spec:
      # Voir microservices.yaml : les variables <SERVICE>_PORT injectees par
      # compatibilite avec les liens Docker ecrasent la configuration homonyme.
      # Semaphore lit SEMAPHORE_PORT et refuse "tcp://ip:port".
      enableServiceLinks: false
      containers:
        - name: {{ $name }}
          image: {{ $spec.image }}
          imagePullPolicy: {{ $root.Values.global.imagePullPolicy }}
          envFrom:
            - secretRef:
                name: {{ $root.Values.global.existingSecret }}
                optional: true
          {{- if eq $name "valkey" }}
          command:
            - sh
            - -c
            - exec valkey-server --requirepass "$VALKEY_PASSWORD" --appendonly yes --dir /data --maxmemory-policy volatile-lru
          {{- end }}
          {{- if eq $name "minio" }}
          args: ["server", "/data"]
          {{- end }}
          {{- if eq $name "semaphore" }}
          # Sans dialecte declare, le script de demarrage attend une base
          # externe et interroge un hote et un port vides. Semaphore sert ici
          # d'executeur Ansible pour un seul projet : une base embarquee sur
          # son volume suffit et evite une base de plus a sauvegarder.
          #
          # bolt et non sqlite : cette version de l'image ne reconnait que
          # mysql, bolt et postgres. SEMAPHORE_DB_PATH designe alors le
          # repertoire, le fichier etant nomme par le script de demarrage.
          env:
            - name: SEMAPHORE_DB_DIALECT
              value: bolt
            - name: SEMAPHORE_DB_PATH
              value: {{ $spec.dataPath }}
            - name: SEMAPHORE_TMP_PATH
              value: /tmp/semaphore
            - name: SEMAPHORE_ADMIN
              value: admin
            - name: SEMAPHORE_ADMIN_EMAIL
              value: admin@kura.io
            - name: SEMAPHORE_ADMIN_NAME
              value: Kura Admin
            - name: SEMAPHORE_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.global.existingSecret }}
                  key: SEMAPHORE_PASSWORD
          {{- end }}
          ports:
            - containerPort: {{ $spec.port }}
              name: main
          volumeMounts:
            - name: data
              mountPath: {{ $spec.dataPath }}
          resources:
            {{- toYaml $spec.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if $spec.storageClassName }}
        storageClassName: {{ $spec.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ $spec.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "kura.labels" $root | nindent 4 }}
    {{- include "kura.selectorLabels" $name | nindent 4 }}
spec:
  selector:
    {{- include "kura.selectorLabels" $name | nindent 4 }}
  ports:
    - port: {{ $spec.port }}
      targetPort: main
{{- end }}
{{- end }}
