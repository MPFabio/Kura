_format_version: "3.0"
_transform: true

# Chaque service backend est ciblé via un objet `upstream` (plutôt qu'une
# URL `http://<nom>:<port>` directe) avec des health checks actifs activés.
# Sans ça, le balancer DNS de Kong met en cache l'IP résolue d'un conteneur
# pour la durée de vie du worker nginx : quand `docker compose up --build`
# recrée un service (nouvelle IP Docker), Kong continue de cibler l'ancienne
# IP et renvoie 502 "Connection refused" jusqu'à un redémarrage manuel.
# Les health checks actifs (intervalle court) détectent la cible morte,
# la marquent unhealthy, et le balancer ré-interroge le DNS Docker
# (127.0.0.11) pour retrouver la nouvelle IP du conteneur recréé.
upstreams:
- name: victoriametrics-upstream
  targets:
  - target: victoriametrics:8428

- name: auth-service-upstream
  targets:
  - target: auth-service:8080
  healthchecks:
    active:
      type: http
      http_path: /health
      timeout: 5
      concurrency: 1
      healthy:
        interval: 5
        successes: 1
      unhealthy:
        interval: 2
        # Trois échecs consécutifs avant de retirer une instance du pool.
        # Avec un seuil de 1, une seule réponse lente — un service Go sous
        # charge, un pic d'entrées/sorties — suffisait à sortir le service et à
        # renvoyer 503 aux utilisateurs, alors qu'il redevenait sain dans les
        # trois secondes. Le délai passe aussi de 2 à 5 s : une sonde de survie
        # doit constater une panne, pas mesurer la latence.
        http_failures: 3
        tcp_failures: 3
        timeouts: 3

- name: k8s-service-upstream
  targets:
  - target: k8s-service:8081
  healthchecks:
    active:
      type: http
      http_path: /health
      timeout: 5
      concurrency: 1
      healthy:
        interval: 5
        successes: 1
      unhealthy:
