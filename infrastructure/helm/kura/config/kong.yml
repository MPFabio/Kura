# Écriture distante des métriques, pour la campagne de charge k6 : elle tourne
# sur la VM d'exploitation, hors du cluster, et ne peut donc pas joindre le
# ClusterIP de VictoriaMetrics directement. Route dédiée à ce seul usage,
# protégée par clé d'API (K6_API_KEY, secret du dépôt d'exploitation) : sans
# elle, n'importe qui disposant de l'URL Kong pourrait injecter de fausses
# métriques dans le tableau de bord.
- name: victoriametrics-write
  url: http://victoriametrics-upstream
  routes:
  - name: metrics-write-route
    paths:
    - /api/v1/metrics-write
    strip_path: true
    methods:
    - POST
    plugins:
    - name: key-auth
      config:
        key_names:
        - X-API-Key

# Route de repli vers l'interface. Kong retient le préfixe le plus long, les
# routes d'API ci-dessus gardent donc la priorité sur celle-ci, qui ne reçoit
# que ce qu'aucune autre ne réclame : les pages et les fichiers du bundle.
#
# Cette entrée n'existe que dans le chart, et c'est voulu : sous Docker Compose
# le frontend publie son propre port et se joint directement, alors que sur le
# cluster l'Ingress dirige tout vers la passerelle. Sans elle, l'interface
# répond 404 alors que toutes les API fonctionnent. À conserver lors d'un
# réalignement des deux configurations.
- name: frontend
  url: http://frontend:8080
  routes:
  - name: frontend-route
    paths:
    - /
    strip_path: false
    # POST, PUT et DELETE sont indispensables : le frontend proxifie Grafana
    # sous /grafana, dont les panneaux interrogent leur source de donnees par
    # POST /grafana/api/ds/query. Limitee aux seules methodes de lecture, cette
    # route laisse Kong repondre 404 et tous les graphiques affichent
    # « No data », alors que les metriques sont bien collectees.
    methods:
    - GET
    - HEAD
    - OPTIONS
    - POST
    - PUT
    - DELETE

# Identité Kong pour la route d'écriture k6 (voir victoriametrics-write
# ci-dessus). Kong ne permet pas de tirer une clé key-auth d'un Secret
# Kubernetes dans une configuration déclarative : clé fixe, à faire tourner en
# la remplaçant ici si elle devait fuiter. Le seul dommage possible avec cette
# clé est l'injection de fausses métriques de charge, jamais un accès aux
# données ou aux autres routes de la plateforme.
consumers:
- username: k6-campagne-charge
  keyauth_credentials:
  - key: xtW3p40YfYGLKOe1clhcj9Z0zZfCyTymKx9FROsusPc

plugins:
# Expose les métriques Kong sur la Status API (/metrics), scrapées par vmagent.
- name: prometheus
  config:
    status_code_metrics: true
    latency_metrics: true
    upstream_health_metrics: true
# Garde-fou global contre une boucle folle ou un client qui s'emballe, et non
# frein a l'usage. Les valeurs precedentes, cent par minute et mille par heure,
# etaient sous l'usage nominal : l'interface emet une dizaine d'appels par page,
# et douze ingenieurs sortant par une meme adresse publique se les partageaient.
#
# Elles contredisaient surtout la mise a l'echelle : un plafond de passerelle
# doit rester au-dessus de la capacite que l'autoscaling est cense fournir,
# sinon il l'annule. Aucun autoscaler ne se declenche derriere une passerelle
# qui laisse passer moins de deux requetes par seconde, et les plafonds de six,
# cinq et quatre replicas n'auraient jamais servi. Constate par la campagne de
# charge, qui n'a mesure que le limiteur tant qu'il est reste a ce niveau.
#
# Le plafond se cale sur la capacite maximale que la mise a l'echelle peut
# fournir, et non sur une valeur ronde. Mesure : deux replicas d'auth-service
# tiennent quatre-vingt-dix requetes par seconde a quarante pour cent de leur
# requete CPU, soit environ soixante-dix-huit par replica au seuil de
# declenchement. Les six replicas du plafond en absorbent donc pres de cinq
# cents. Limiter la passerelle en dessous rendrait ces replicas inatteignables :
# on paierait un autoscaler qui ne peut pas se declencher.
#
# Cinq cents requetes par seconde restent une protection reelle : une boucle
# folle l'atteint en quelques secondes, douze utilisateurs jamais.
#
# La protection contre la force brute reste sur /api/v1/auth, ou elle a un objet
# precis, avec ses vingt requetes par minute.
- name: rate-limiting
  config:
    minute: 30000
    hour: 500000
    policy: local
- name: cors
  config:
    origins:
    - "*"
    methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
    headers:
    - Accept
    - Accept-Version
    - Content-Length
    - Content-MD5
    - Content-Type
    - Date
    - Authorization
    - X-Project-ID
    exposed_headers:
    - X-Auth-Token
    credentials: true
    max_age: 3600
