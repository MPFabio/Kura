services:
- name: auth-service
  url: http://auth-service-upstream
  routes:
  - name: auth-route
    paths:
    - /api/v1/auth
    strip_path: false
    methods:
    - GET
    - POST
    - PUT
    - DELETE
    plugins:
    - name: rate-limiting
      config:
        minute: 20
        hour: 200
        policy: local
        limit_by: ip
        error_message: "Trop de tentatives d'authentification. Veuillez réessayer plus tard."
  - name: projects-route
    paths:
    - /api/v1/projects
    strip_path: false
    methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS

- name: k8s-service
  url: http://k8s-service-upstream
  connect_timeout: 15000   # 15s pour établir la connexion
  read_timeout: 120000     # 120s (auth GKE + appel API peuvent être lents)
  write_timeout: 60000     # 60s
  routes:
  - name: k8s-route
    paths:
    - /api/v1/k8s
    strip_path: false
    methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    protocols:
    - http
    - https

- name: terraform-service
  url: http://terraform-service-upstream
  # La detection de drift lance `tofu init` puis `plan -refresh-only` : au
  # premier appel, le telechargement du provider depasse le defaut de 60 s.
  connect_timeout: 60000
  write_timeout: 300000
  read_timeout: 300000
  routes:
  - name: terraform-route
    paths:
    - /api/v1/terraform
    strip_path: false
    methods:
    - GET
    - POST
    - PUT
    - DELETE

- name: ansible-service
  url: http://ansible-service-upstream
  routes:
  - name: ansible-route
    paths:
    - /api/v1/ansible
    strip_path: false
    methods:
    - GET
    - POST
    - PUT
    - DELETE
  - name: ansible-webhooks-route
    paths:
    - /api/v1/webhooks/ansible
    strip_path: false
    methods:
    - POST

- name: metrics-service
  url: http://metrics-service-upstream
  routes:
  - name: metrics-route
    paths:
    - /api/v1/metrics
    strip_path: false
    methods:
    - GET
    - OPTIONS

- name: code-service
  url: http://code-service-upstream
