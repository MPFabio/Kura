name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test:ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # Build + tests + SAST dans le même job : une seule liste de services fait
  # autorité, un service ajouté ici est automatiquement scanné par gosec.
  services-go:
    name: Services Go (build, test, gosec)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ansible-service, auth-service, code-service, k8s-service, metrics-service, pipeline-service, terraform-service, vault-service]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # Aligné sur la directive go des modules (1.25). Une version
          # inférieure fonctionne — Go télécharge alors automatiquement la
          # chaîne requise — mais elle est retéléchargée à chaque exécution,
          # et la version affichée ici cesse de décrire ce qui compile
          # réellement le code.
          go-version: '1.25'
          cache-dependency-path: services/${{ matrix.service }}/go.sum

      - name: Build ${{ matrix.service }}
        run: go build -v ./...
        working-directory: services/${{ matrix.service }}

      - name: Test ${{ matrix.service }}
        run: go test ./... -v
        working-directory: services/${{ matrix.service }}

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.22.0

      # Bloque le pipeline à partir de la sévérité MEDIUM ; les findings LOW
      # (G104 notamment) restent visibles dans les logs sans casser le build.
      - name: SAST gosec on ${{ matrix.service }}
        run: gosec -severity medium -exclude-generated ./...
        working-directory: services/${{ matrix.service }}

  # Publication des images applicatives.
  #
  # Le déploiement tire ses images d'un registre : sans cette étape, la chaîne
  # s'arrête au test et rien n'est déployable. Les images ne sont publiées
  # qu'après le passage des tests et de l'analyse statique, et uniquement sur
  # un push : une pull request construit sans publier, pour valider le
  # Dockerfile sans encombrer le registre.
  images:
    name: Images (construction et publication)
    runs-on: ubuntu-latest
    needs: [frontend, services-go]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - ansible-service
          - auth-service
          - code-service
          - k8s-service
          - metrics-service
          - pipeline-service
          - terraform-service
          - vault-service
          - frontend
    steps:
      - uses: actions/checkout@v4

      - name: Connexion au registre
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Le chemin d'image suit la convention du chart Helm
      # (<registre>/kura/<service>), et non celle du docker-compose.
      - name: Étiquettes de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/kura/${{ matrix.service }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Construction et publication
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service == 'frontend' && 'frontend' || format('services/{0}', matrix.service) }}
          build-args: ${{ matrix.service == 'frontend' && 'VITE_API_BASE_URL=/api' || '' }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
