server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # application/javascript etait absent de gzip_types : le bundle (2,1 Mo)
    # partait non compresse. Images et woff2 exclus, deja compresses.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Éviter cache HTML (toujours prendre la dernière version après rebuild)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # API proxy
    # `^~` : priorité sur le bloc regex de cache plus bas, qui capturerait
    # sinon toute URL se terminant par .js/.css/.svg avant d'arriver ici.
    location ^~ /api {
        proxy_pass http://kong:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        # La detection de drift (tofu init + plan -refresh-only) depasse le
        # defaut de 60 s : sans cela nginx coupe, ce qui annule le contexte
        # de la requete et interrompt tofu en cours d'execution.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Proxy Grafana (dashboards embarqués)
    # `^~` indispensable : sans lui, nginx évalue le bloc regex de cache
    # statique avant ce préfixe, et les assets de Grafana
    # (/grafana/public/build/*.css|js) sont cherchés sur le disque local -> 404,
    # d'où le message « Grafana has failed to load its application files ».
    location ^~ /grafana {
        proxy_pass http://grafana:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # vmalert : interface de consultation des regles d'alerte. Proxifiee plutot
    # qu'exposee, le pare-feu n'ouvrant que 80, 443, 5173, 8000 et 8001.
    location ^~ /vmalert {
        proxy_pass http://vmalert:8880;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
